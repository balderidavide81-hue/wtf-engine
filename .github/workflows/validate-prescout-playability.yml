name: Validate pre-scout playability

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: ./node_modules/.bin/tsc --noEmit false --outDir .tmp-build
      - name: Compare live ranked batch
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const { collect } = await import('./.tmp-build/src/ingest/collect.js');
          const { selectScoutCandidates } = await import('./.tmp-build/src/pipeline/daily.js');
          const { preScoutPlayability } = await import('./.tmp-build/src/pipeline/playability.js');
          const { prefilterDetailed } = await import('./.tmp-build/src/filters/pipeline.js');

          const sensitiveExamples = [
            ['it-minors', 'Nisseno, trovate le sorelline scomparse'],
            ['en-domestic', 'How rural policing gaps can make escaping domestic violence harder'],
            ['fr-minor', 'Un enfant disparu retrouvé après plusieurs jours'],
            ['es-kidnap', 'Secuestro de una menor investigado por la policía'],
            ['pt-kidnap', 'Sequestro de criança mobiliza autoridades locais'],
            ['id-kidnap', 'Penculikan anak sedang diselidiki polisi']
          ];
          for (const [id, title] of sensitiveExamples) {
            const check = prefilterDetailed([{
              id,
              sourceName: 'synthetic',
              sourceUrl: `https://example.com/${id}`,
              title
            }]);
            if (check.candidates.length !== 0 || check.dropped.sensitive !== 1) {
              throw new Error(`sensitivity fixture escaped prefilter: ${id}`);
            }
          }

          const accentedPolitics = preScoutPlayability({
            id: 'pt-politics',
            sourceName: 'synthetic',
            sourceUrl: 'https://example.com/pt-politics',
            title: 'Política e eleições: por que partidos recorrem ao populismo'
          });
          if (!accentedPolitics.negativeSignals.includes('policy-politics')) {
            throw new Error('accent-insensitive politics signal failed');
          }

          const report = await collect();
          if (report.kept < 30) throw new Error(`collector kept only ${report.kept} candidates`);
          const selected = selectScoutCandidates(report.candidates, 30);
          const availableLanguages = [...new Set(report.candidates.map(c => c.language).filter(Boolean))];
          const rows = selected.map(candidate => ({
            score: preScoutPlayability(candidate).score,
            positive: preScoutPlayability(candidate).positiveSignals,
            negative: preScoutPlayability(candidate).negativeSignals,
            language: candidate.language,
            sourceCountry: candidate.sourceCountry ?? candidate.country,
            eventCountry: candidate.eventCountry,
            source: candidate.sourceName,
            title: candidate.title
          }));

          const countBy = (getter) => {
            const counts = {};
            for (const candidate of selected) {
              const key = getter(candidate) ?? 'UNKNOWN';
              counts[key] = (counts[key] ?? 0) + 1;
            }
            return Object.fromEntries(Object.entries(counts).sort((a,b) => b[1]-a[1]));
          };

          console.log('SOURCE_ERRORS=' + JSON.stringify(report.errors));
          console.log('PRESCOUT_BATCH=' + JSON.stringify({
            fetched: report.fetched,
            kept: report.kept,
            sensitiveDropped: report.dropped.sensitive,
            selected: selected.length,
            availableLanguages,
            languages: countBy(c => c.language),
            sourceCountries: countBy(c => c.sourceCountry ?? c.country),
            eventCountries: countBy(c => c.eventCountry),
            qualityCount: rows.filter(r => r.score >= 10).length,
            positiveCount: rows.filter(r => r.positive.length > 0).length,
            negativeOnlyCount: rows.filter(r => r.positive.length === 0 && r.negative.length > 0).length,
            rows
          }));

          if (selected.length !== 30) throw new Error('expected 30 selected candidates');
          if (rows.filter(r => r.score >= 10).length < 20) {
            throw new Error('fewer than 20 paid Scout candidates meet the deterministic quality threshold');
          }
          if (rows.some(r => r.positive.length === 0 && r.negative.length > 0)) {
            throw new Error('paid Scout batch contains a negative-only candidate');
          }
          const selectedLanguageCount = new Set(selected.map(c => c.language).filter(Boolean)).size;
          if (selectedLanguageCount < Math.min(5, availableLanguages.length)) {
            throw new Error(`multilingual exploration under-covered live source languages: ${selectedLanguageCount}/${availableLanguages.length}`);
          }
          NODE
