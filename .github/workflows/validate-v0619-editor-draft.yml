name: Validate v0.6.19 complete Editor batching and draft probe

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: ./node_modules/.bin/tsc --noEmit false --outDir .tmp-build

      - name: Validate Editor batching helpers
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const {
            splitEditorBatches,
            combineAiUsageDiagnostics
          } = await import('./.tmp-build/src/pipeline/daily.js');

          const sizes = [0, 1, 12, 13, 16, 30];
          const expected = {
            0: [],
            1: [1],
            12: [12],
            13: [12,1],
            16: [12,4],
            30: [12,12,6]
          };

          for (const size of sizes) {
            const items = Array.from({length:size}, (_,i)=>i);
            const batches = splitEditorBatches(items);
            const actual = batches.map(batch => batch.length);
            if (JSON.stringify(actual) !== JSON.stringify(expected[size])) {
              throw new Error('Unexpected batching for ' + size + ': ' + JSON.stringify(actual));
            }
            const flattened = batches.flat();
            if (JSON.stringify(flattened) !== JSON.stringify(items)) {
              throw new Error('Batching changed item order/content for ' + size);
            }
          }

          const pricing = {
            inputPerMillionUsd: 0.2,
            cachedInputPerMillionUsd: 0.02,
            outputPerMillionUsd: 1.2,
            source: 'fixture'
          };
          const combined = combineAiUsageDiagnostics([
            {model:'gpt-5.6-luna',inputTokens:100,cachedInputTokens:10,outputTokens:20,totalTokens:120,estimatedCostUsd:0.001,pricing},
            {model:'gpt-5.6-luna',inputTokens:200,cachedInputTokens:20,outputTokens:30,totalTokens:230,estimatedCostUsd:0.002,pricing}
          ]);
          const expectedUsage = {
            inputTokens:300,
            cachedInputTokens:30,
            outputTokens:50,
            totalTokens:350,
            estimatedCostUsd:0.003
          };
          for (const [key,value] of Object.entries(expectedUsage)) {
            if (Math.abs(combined[key]-value) > 1e-12) {
              throw new Error('Combined usage mismatch for ' + key + ': ' + combined[key]);
            }
          }

          console.log('EDITOR_BATCHING_V0619=' + JSON.stringify({
            sixteen: splitEditorBatches(Array.from({length:16},(_,i)=>i)).map(batch=>batch.length),
            thirty: splitEditorBatches(Array.from({length:30},(_,i)=>i)).map(batch=>batch.length),
            combinedUsage: expectedUsage,
            status:'PASS'
          }));
          NODE
