name: Export current global Scout batch

on:
  pull_request:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: ./node_modules/.bin/tsc --noEmit false --outDir .tmp-build
      - name: Collect and print ranked 30
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const { collect } = await import('./.tmp-build/src/ingest/collect.js');
          const { selectScoutCandidates } = await import('./.tmp-build/src/pipeline/daily.js');
          const { preScoutPlayability } = await import('./.tmp-build/src/pipeline/playability.js');
          const report = await collect();
          const selected = selectScoutCandidates(report.candidates, 30);
          const out = {
            collection: {
              sourceCount: report.sourceCount,
              fetched: report.fetched,
              kept: report.kept,
              errors: report.errors
            },
            selected: selected.map((c, index) => ({
              index,
              id: c.id,
              title: c.title,
              summary: c.summary ?? null,
              language: c.language ?? null,
              sourceName: c.sourceName,
              sourceCountry: c.sourceCountry ?? c.country ?? null,
              eventCountry: c.eventCountry ?? null,
              eventLocation: c.eventLocation ?? null,
              categoryHint: c.categoryHint ?? null,
              playability: preScoutPlayability(c)
            }))
          };
          console.log('SCOUT_BATCH_JSON=' + JSON.stringify(out));
          NODE
