name: Research v0.6.13 Korea RSS quality

on:
  pull_request:
    branches: [main]

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: ./node_modules/.bin/tsc --noEmit false --outDir .tmp-build

      - name: Score Korea.net category feeds
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const { RssSource } = await import('./.tmp-build/src/ingest/rss.js');
          const { prefilterDetailed } = await import('./.tmp-build/src/filters/pipeline.js');
          const { preScoutPlayability } = await import('./.tmp-build/src/pipeline/playability.js');

          const feeds = [
            ['Korea.net Culture', 'https://www.korea.net/koreanet/rss/news/7', 'culture'],
            ['Korea.net Food Travel', 'https://www.korea.net/koreanet/rss/news/8', 'culture'],
            ['Korea.net Sci Tech', 'https://www.korea.net/koreanet/rss/news/5', 'technology']
          ];

          async function traceRedirects(name, startUrl) {
            let url = startUrl;
            for (let hop = 0; hop < 8; hop += 1) {
              const res = await fetch(url, {
                headers: { 'user-agent': 'wtf-engine-source-research/0.6.13' },
                redirect: 'manual'
              });
              const location = res.headers.get('location');
              console.log('KOREA_REDIRECT=' + JSON.stringify({ name, hop, url, status: res.status, location }));
              if (res.status < 300 || res.status >= 400 || !location) return;
              url = new URL(location, url).toString();
            }
          }

          for (const [name, url] of feeds) await traceRedirects(name, url);

          for (const [name, url, categoryHint] of feeds) {
            try {
              const source = new RssSource({
                name, url, language:'en', country:'KR', discoverySource:name,
                categoryHint, mediaUsageStatus:'link-only'
              });
              const raw = await source.fetchCandidates();
              const filtered = prefilterDetailed(raw);
              const ranked = filtered.candidates
                .map(candidate => ({
                  candidate,
                  score: preScoutPlayability(candidate).score
                }))
                .sort((a,b)=>b.score-a.score);

              console.log('KOREA_FEED=' + JSON.stringify({
                name,
                raw:raw.length,
                kept:filtered.candidates.length,
                dropped:filtered.dropped,
                top:ranked.slice(0,10).map(({candidate,score})=>({
                  score,
                  title:candidate.title,
                  publishedAt:candidate.publishedAt,
                  eventCountry:candidate.eventCountry,
                  sourceUrl:candidate.sourceUrl
                }))
              }));
            } catch (error) {
              console.log('KOREA_FEED=' + JSON.stringify({
                name, error:error instanceof Error ? error.message : String(error)
              }));
            }
          }
          NODE
