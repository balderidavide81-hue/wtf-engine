name: v0.5 final validation

on:
  push:
    branches:
      - feature/0.5-content-store

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wtf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wtf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Apply v0.5 migration
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/001_content_store_v05.sql
      - name: Reapply migration idempotently
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/001_content_store_v05.sql
