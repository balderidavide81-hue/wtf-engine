name: Validate v0.6.17 Editor deterministic quality

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: ./node_modules/.bin/tsc --noEmit false --outDir .tmp-build

      - name: Validate leakage guard and answer-position balancing
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const {
            validateCardDraft,
            balanceResolvedAnswerPosition
          } = await import('./.tmp-build/src/ai/editor.js');

          function base(overrides = {}) {
            return {
              articleId: 'fixture',
              mode: 'WTF',
              interactionType: 'MULTIPLE_CHOICE',
              category: 'animals',
              hook: 'Qualcosa di insolito è comparso in autostrada.',
              question: 'Quale animale era?',
              options: ['Un emù bianco', 'Un lama', 'Un cigno'],
              correctOptionIndex: 0,
              reveal: 'Era un emù bianco.',
              resolutionRule: null,
              ...overrides
            };
          }

          function expectThrow(name, fn) {
            let threw = false;
            try { fn(); } catch (error) {
              threw = true;
              console.log('EXPECTED_THROW=' + JSON.stringify({ name, message: error instanceof Error ? error.message : String(error) }));
            }
            if (!threw) throw new Error(name + ' did not fail');
          }

          validateCardDraft(base());

          expectThrow('multiple-choice answer leakage', () =>
            validateCardDraft(base({
              articleId: 'leak-animal',
              hook: 'Un emù bianco vaga in una corsia autostradale.'
            }))
          );

          expectThrow('numeric answer leakage', () =>
            validateCardDraft(base({
              articleId: 'leak-number',
              category: 'records',
              hook: 'Una collezione assurda conta 754 pezzi.',
              question: 'Quanti pezzi conta?',
              options: ['754', '700', '800'],
              correctOptionIndex: 0,
              reveal: 'Il totale è 754.'
            }))
          );

          expectThrow('true-false claim repeated in hook', () =>
            validateCardDraft(base({
              articleId: 'tf-leak',
              interactionType: 'TRUE_FALSE',
              hook: 'La nuova specie è la prima riconosciuta in oltre un secolo.',
              question: 'Vero o falso: la nuova specie è la prima riconosciuta in oltre un secolo?',
              options: ['Vero', 'Falso'],
              correctOptionIndex: 0
            }))
          );

          validateCardDraft(base({
            articleId: 'tf-reversed',
            interactionType: 'TRUE_FALSE',
            hook: 'Una scoperta felina ha sorpreso i ricercatori.',
            question: 'Vero o falso: la specie era già nota da decenni?',
            options: ['Falso', 'Vero'],
            correctOptionIndex: 0,
            reveal: 'No: è una nuova specie.'
          }));

          const tfPositions = new Set();
          for (let i = 0; i < 64; i += 1) {
            const card = base({
              articleId: 'tf-' + i,
              interactionType: 'TRUE_FALSE',
              hook: 'Una scoperta insolita.',
              question: 'Vero o falso: il fatto è confermato?',
              options: ['Vero', 'Falso'],
              correctOptionIndex: 0
            });
            const expectedAnswer = card.options[card.correctOptionIndex];
            const balanced = balanceResolvedAnswerPosition(card);
            if (balanced.options[balanced.correctOptionIndex] !== expectedAnswer) {
              throw new Error('TRUE_FALSE balancing changed correctness');
            }
            validateCardDraft(balanced);
            tfPositions.add(balanced.correctOptionIndex);
          }
          if (tfPositions.size !== 2) throw new Error('TRUE_FALSE positions did not cover both indexes');

          const mcPositions = new Set();
          for (let i = 0; i < 128; i += 1) {
            const card = base({
              articleId: 'mc-' + i,
              options: ['A', 'B', 'C', 'D'],
              correctOptionIndex: 0
            });
            const expectedAnswer = card.options[card.correctOptionIndex];
            const balanced = balanceResolvedAnswerPosition(card);
            if (balanced.options[balanced.correctOptionIndex] !== expectedAnswer) {
              throw new Error('MULTIPLE_CHOICE balancing changed correctness');
            }
            mcPositions.add(balanced.correctOptionIndex);
          }
          if (mcPositions.size !== 4) throw new Error('MULTIPLE_CHOICE positions did not cover all four indexes');

          const predict = {
            articleId: 'predict',
            mode: 'PREDICT',
            interactionType: 'PREDICT',
            category: 'culture',
            hook: 'Un oggetto famoso va all’asta.',
            question: 'Come finirà?',
            options: ['Venduto', 'Offerto ma invenduto', 'Ritirato prima dell’asta'],
            correctOptionIndex: null,
            reveal: 'L’esito sarà verificato dopo l’asta.',
            resolutionRule: 'Usare il risultato ufficiale della casa d’aste.'
          };
          const unchanged = balanceResolvedAnswerPosition(predict);
          if (JSON.stringify(unchanged) !== JSON.stringify(predict)) throw new Error('PREDICT card was modified');
          validateCardDraft(unchanged);

          console.log('EDITOR_QUALITY_GATE=' + JSON.stringify({
            trueFalsePositions: [...tfPositions].sort(),
            multipleChoicePositions: [...mcPositions].sort(),
            status: 'PASS'
          }));
          NODE
