name: Validate v0.6.18 Editor final hardening

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: ./node_modules/.bin/tsc --noEmit false --outDir .tmp-build

      - name: Validate batch answer balancing
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const {
            EDITOR_PROMPT_VERSION,
            balanceResolvedAnswerPositions,
            validateCardDraft
          } = await import('./.tmp-build/src/ai/editor.js');

          if (EDITOR_PROMPT_VERSION !== 'editor/inline-v0.8-final-hardening') {
            throw new Error('unexpected Editor prompt version: ' + EDITOR_PROMPT_VERSION);
          }

          function mc(id, correctOptionIndex = 0) {
            return {
              articleId: id,
              mode: 'WTF',
              interactionType: 'MULTIPLE_CHOICE',
              category: 'other',
              hook: 'Un fatto curioso senza risposta anticipata.',
              question: 'Qual è la risposta corretta?',
              options: ['A', 'B', 'C', 'D'],
              correctOptionIndex,
              reveal: 'La risposta è confermata dalla fonte.',
              resolutionRule: null
            };
          }

          function tf(id, truth = true) {
            return {
              articleId: id,
              mode: 'WTF',
              interactionType: 'TRUE_FALSE',
              category: 'other',
              hook: 'Un fatto curioso merita una verifica.',
              question: 'Questa affermazione è corretta?',
              options: ['Vero', 'Falso'],
              correctOptionIndex: truth ? 0 : 1,
              reveal: truth ? 'Vero.' : 'Falso.',
              resolutionRule: null
            };
          }

          const originalMc = Array.from({length: 11}, (_, i) => mc('mc-' + i, i % 4));
          const originalTf = [tf('tf-a', true), tf('tf-b', true), tf('tf-c', false)];
          const predict = {
            articleId: 'predict',
            mode: 'PREDICT',
            interactionType: 'PREDICT',
            category: 'culture',
            hook: 'Un oggetto va all’asta.',
            question: 'Quale sarà l’esito?',
            options: ['Venduto', 'Invenduto', 'Ritirato'],
            correctOptionIndex: null,
            reveal: 'L’esito sarà verificato dopo l’asta.',
            resolutionRule: 'Usare il risultato ufficiale.'
          };

          const input = [...originalMc, ...originalTf, predict];
          const expectedOrder = input.map(card => card.articleId);
          const correctAnswerById = new Map(
            input
              .filter(card => card.correctOptionIndex !== null)
              .map(card => [card.articleId, card.options[card.correctOptionIndex]])
          );

          const balanced = balanceResolvedAnswerPositions(input);
          if (JSON.stringify(balanced.map(card => card.articleId)) !== JSON.stringify(expectedOrder)) {
            throw new Error('batch balancing changed card order');
          }

          for (const card of balanced) {
            validateCardDraft(card);
            if (card.correctOptionIndex !== null) {
              const before = correctAnswerById.get(card.articleId);
              const after = card.options[card.correctOptionIndex];
              if (before !== after) throw new Error('correctness changed for ' + card.articleId);
            }
          }

          const mcCounts = [0,0,0,0];
          for (const card of balanced.filter(card => card.interactionType === 'MULTIPLE_CHOICE')) {
            mcCounts[card.correctOptionIndex] += 1;
          }
          const mcMax = Math.max(...mcCounts);
          const mcMin = Math.min(...mcCounts);
          if (mcMax - mcMin > 1) {
            throw new Error('MULTIPLE_CHOICE batch distribution is not near-uniform: ' + JSON.stringify(mcCounts));
          }

          const tfCounts = [0,0];
          for (const card of balanced.filter(card => card.interactionType === 'TRUE_FALSE')) {
            tfCounts[card.correctOptionIndex] += 1;
          }
          const tfMax = Math.max(...tfCounts);
          const tfMin = Math.min(...tfCounts);
          if (tfMax - tfMin > 1) {
            throw new Error('TRUE_FALSE batch distribution is not near-uniform: ' + JSON.stringify(tfCounts));
          }

          const predictAfter = balanced.find(card => card.articleId === 'predict');
          if (JSON.stringify(predictAfter) !== JSON.stringify(predict)) {
            throw new Error('PREDICT card was modified');
          }

          console.log('EDITOR_V0618_BALANCE=' + JSON.stringify({
            promptVersion: EDITOR_PROMPT_VERSION,
            multipleChoice: mcCounts,
            trueFalse: tfCounts,
            status: 'PASS'
          }));
          NODE
