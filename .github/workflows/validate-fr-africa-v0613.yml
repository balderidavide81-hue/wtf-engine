name: Validate v0.6.13 French semantic parity

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: ./node_modules/.bin/tsc --noEmit false --outDir .tmp-build

      - name: Validate French playability and sensitivity parity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const { preScoutPlayability } = await import('./.tmp-build/src/pipeline/playability.js');
          const { prefilterDetailed } = await import('./.tmp-build/src/filters/pipeline.js');

          const candidate = {
            id: 'fr-camel',
            sourceName: 'Fixture',
            sourceUrl: 'https://example.com/fr-camel',
            title: "Tunisie: Un jeune chameau échappe à l'abattage grâce à sa beauté rare",
            summary: "Le jeune chameau a évité l'abattage après avoir attiré l'attention pour son apparence rare.",
            language: 'fr',
            sourceLanguage: 'fr',
            country: 'TN',
            sourceCountry: 'TN',
            eventCountry: 'TN',
            categoryHint: 'animals',
            mediaUsageStatus: 'link-only'
          };

          const score = preScoutPlayability(candidate);
          console.log('FRENCH_PLAYABILITY=' + JSON.stringify(score));
          if (score.score < 25) throw new Error('French animal/escape signals are still too weak');

          const fatal = {
            ...candidate,
            id: 'fr-fatal',
            sourceUrl: 'https://example.com/fr-fatal',
            title: "Ile Maurice: Un feu pour éloigner les moustiques coûte la vie à une septuagénaire",
            summary: "Un incident domestique coûte la vie à une septuagénaire."
          };
          const filtered = prefilterDetailed([fatal]);
          console.log('FRENCH_SENSITIVITY=' + JSON.stringify(filtered.dropped));
          if (filtered.candidates.length !== 0 || filtered.dropped.sensitive !== 1) {
            throw new Error('French fatality phrasing survived the prefilter');
          }
          NODE
