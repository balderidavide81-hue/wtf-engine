name: Validate v0.6.13 Francophone Africa wildlife

# Re-run after French semantic parity + fatality filtering

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: ./node_modules/.bin/tsc --noEmit false --outDir .tmp-build

      - name: Validate French Africa feed and selection
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const { RssSource } = await import('./.tmp-build/src/ingest/rss.js');
          const { prefilterDetailed } = await import('./.tmp-build/src/filters/pipeline.js');
          const { preScoutPlayability } = await import('./.tmp-build/src/pipeline/playability.js');
          const { collect } = await import('./.tmp-build/src/ingest/collect.js');
          const { selectScoutCandidates } = await import('./.tmp-build/src/pipeline/daily.js');

          const source = new RssSource({
            name: 'AllAfrica Faune',
            url: 'https://fr.allafrica.com/tools/headlines/rdf/wildlife/headlines.rdf',
            language: 'fr',
            country: 'AFRICA',
            discoverySource: 'AllAfrica Faune',
            categoryHint: 'animals',
            mediaUsageStatus: 'link-only'
          });

          const raw = await source.fetchCandidates();
          const filtered = prefilterDetailed(raw);
          console.log('FR_AFRICA_RAW=' + JSON.stringify(raw.map(candidate => ({
            title: candidate.title,
            language: candidate.language,
            eventCountry: candidate.eventCountry,
            score: preScoutPlayability(candidate).score
          }))));

          if (raw.length < 5) throw new Error('AllAfrica Faune returned too few RDF items: ' + raw.length);
          if (raw.filter(candidate => candidate.language === 'fr').length < Math.ceil(raw.length * 0.7)) {
            throw new Error('French language detection unexpectedly weak');
          }

          const report = await collect();
          const selected = selectScoutCandidates(report.candidates, 30);
          const kept = report.candidates.filter(candidate => candidate.discoverySource === 'AllAfrica Faune');
          const selectedFrAfrica = selected.filter(candidate => candidate.discoverySource === 'AllAfrica Faune');

          console.log('FR_AFRICA_GATE=' + JSON.stringify({
            raw: raw.length,
            standaloneKept: filtered.candidates.length,
            standaloneDropped: filtered.dropped,
            fullCollector: {
              sourceCount: report.sourceCount,
              fetched: report.fetched,
              kept: report.kept,
              errors: report.errors,
              dropped: report.dropped
            },
            kept: kept.map(candidate => ({
              title: candidate.title,
              language: candidate.language,
              eventCountry: candidate.eventCountry,
              score: preScoutPlayability(candidate).score
            })),
            selected: selectedFrAfrica.map(candidate => ({
              title: candidate.title,
              language: candidate.language,
              eventCountry: candidate.eventCountry,
              score: preScoutPlayability(candidate).score
            }))
          }));

          if (kept.length < 1) throw new Error('AllAfrica Faune produced no safe candidates');
          if (selectedFrAfrica.length < 1) throw new Error('AllAfrica Faune did not earn a pre-Scout slot');
          NODE
