name: Validate global batch quality v2

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: ./node_modules/.bin/tsc --noEmit false --outDir .tmp-build
      - name: Synthetic and live quality checks
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const { extractEventGeography } = await import('./.tmp-build/src/geo/extract.js');
          const { prefilterDetailed } = await import('./.tmp-build/src/filters/pipeline.js');
          const { collect } = await import('./.tmp-build/src/ingest/collect.js');
          const { selectScoutCandidates } = await import('./.tmp-build/src/pipeline/daily.js');
          const { preScoutPlayability } = await import('./.tmp-build/src/pipeline/playability.js');
          const { detectContentLanguage } = await import('./.tmp-build/src/ingest/language.js');

          const geoChecks = [
            ['New Mexico', extractEventGeography({title:'Horse escapes New Mexico parade in Santa Fe'}), 'US', 'New Mexico'],
            ['New Jersey', extractEventGeography({title:'Loose horses rounded up in New Jersey town'}), 'US', 'New Jersey'],
            ['cross-border', extractEventGeography({title:'New Mexico and Mexico announce joint event'}), null, null]
          ];
          for (const [label, actual, country, location] of geoChecks) {
            console.log('geo', label, actual);
            if ((actual.eventCountry ?? null) !== country) throw new Error('geo country failed: '+label);
            if ((actual.eventLocation ?? null) !== location) throw new Error('geo location failed: '+label);
          }

          const sensitive = prefilterDetailed([{
            id:'s1', sourceName:'fixture', sourceUrl:'https://example.com/s1',
            title:'Torna il rito', summary:'Il testo ricorda dei bambini uccisi durante la guerra.'
          }]);
          if (sensitive.dropped.sensitive !== 1) throw new Error('Italian plural sensitivity fixture failed');

          const repeatedSummary='La nuova rassegna celebra grandi protagonisti della musica con premi speciali, ospiti, musica dal vivo e una lunga serie di riconoscimenti nella stessa serata a Taormina.';
          const dedupe = prefilterDetailed([
            {id:'d1',sourceName:'fixture',sourceUrl:'https://example.com/d1',title:'Al via i Music Awards',summary:repeatedSummary},
            {id:'d2',sourceName:'fixture',sourceUrl:'https://example.com/d2',title:'Culture pagina 162',summary:repeatedSummary}
          ]);
          if (dedupe.candidates.length !== 1 || dedupe.dropped.nearDuplicateSummary !== 1) {
            throw new Error('summary dedupe fixture failed');
          }

          const debunk = preScoutPlayability({
            id:'p1',sourceName:'UPI Odd News',discoverySource:'UPI Odd News',
            sourceUrl:'https://example.com/p1',
            title:'No tiger on the loose in New Jersey, despite viral video claims'
          });
          if (!debunk.negativeSignals.includes('debunked-or-non-event') || debunk.score >= 10) {
            throw new Error('debunk demotion fixture failed');
          }

          const englishDetected = detectContentLanguage(
            'Climate change also poses a threat to cultural heritage',
            'Nearly half of the sites in Europe are now highly vulnerable to climate-related risks.',
            'fr'
          );
          const frenchDetected = detectContentLanguage(
            'Les populations africaines veulent des services climatiques adaptés',
            'Les communautés locales demandent des informations qui répondent à leurs besoins et à leur territoire.',
            'en'
          );
          if (englishDetected !== 'en' || frenchDetected !== 'fr') {
            throw new Error(`content language fixture failed: ${englishDetected}/${frenchDetected}`);
          }

          const report = await collect();
          if (report.kept < 30) throw new Error('live collector kept fewer than 30');
          const selected = selectScoutCandidates(report.candidates,30);
          const countBy=(get)=>{
            const out={}; for (const c of selected){const k=get(c)??'UNKNOWN';out[k]=(out[k]??0)+1;} return out;
          };
          const sources=countBy(c=>c.sourceName);
          const countries=countBy(c=>c.sourceCountry??c.country);
          const languages=countBy(c=>c.language);
          const maxSource=Math.max(...Object.values(sources));
          const concreteCountries=Object.fromEntries(Object.entries(countries).filter(([key])=>/^[A-Z]{2}$/.test(key)));
          const maxCountry=Math.max(0,...Object.values(concreteCountries));
          const encoded=report.candidates.filter(c=>/&#(?:0*39|x0*27);/i.test(c.title));
          const mothers=report.candidates.find(c=>/Mother's urging leads Va\. woman/i.test(c.title));
          const tiger=selected.find(c=>/No tiger on the loose/i.test(c.title));
          const taormina=selected.filter(c=>/Taormina Music Awards|Culture p\.162/i.test(c.title));

          console.log('QUALITY_RESULT='+JSON.stringify({
            fetched:report.fetched,kept:report.kept,dropped:report.dropped,errors:report.errors,
            sources,countries,concreteCountries,languages,maxSource,maxCountry,
            encodedTitles:encoded.length,
            mothersTitle:mothers?.title??null,
            tigerSelected:Boolean(tiger),
            taorminaSelected:taormina.map(c=>c.title),
            selected:selected.map(c=>({
              title:c.title,source:c.sourceName,language:c.language,sourceLanguage:c.sourceLanguage,
              sourceCountry:c.sourceCountry??c.country,eventCountry:c.eventCountry,
              eventLocation:c.eventLocation,playability:preScoutPlayability(c)
            }))
          }));

          if (maxSource > 6) throw new Error('source cap exceeded: '+maxSource);
          if (maxCountry > 6) throw new Error('concrete country cap exceeded: '+maxCountry);
          if (encoded.length) throw new Error('HTML apostrophe entity still present');
          if (!mothers?.title.includes("Mother's")) throw new Error('apostrophe decode not observed');
          if (tiger) throw new Error('debunked tiger story still selected');
          if (taormina.length > 1) throw new Error('duplicate Taormina content still selected');
          NODE
