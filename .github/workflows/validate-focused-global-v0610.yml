name: Validate focused global sources and dedupe

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: ./node_modules/.bin/tsc --noEmit false --outDir .tmp-build

      - name: Validate semantic dedupe and live source mix
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const { nearDuplicateStory, dedupeNearStories } = await import('./.tmp-build/src/filters/story-dedupe.js');
          const { collect } = await import('./.tmp-build/src/ingest/collect.js');
          const { selectScoutCandidates } = await import('./.tmp-build/src/pipeline/daily.js');
          const { preScoutPlayability } = await import('./.tmp-build/src/pipeline/playability.js');

          const smithsonian = {
            id: 'a',
            sourceName: 'Smithsonian Smart News',
            sourceUrl: 'https://example.com/a',
            title: 'Three Wild Dogs Made a Record-Breaking Trek Across Zambia, Traveling More Than 2,500 Miles in Search of Mates',
            summary: 'The canines achieved the longest recorded movement by any African mammal. Their journey highlights wildlife corridors.',
            publishedAt: '2026-09-21T12:00:00Z',
            eventCountry: 'ZM'
          };
          const phys = {
            id: 'b',
            sourceName: 'Phys.org Plants & Animals',
            sourceUrl: 'https://example.com/b',
            title: 'Wild dogs make the longest recorded journey of any terrestrial mammal in Africa',
            summary: 'African wild dogs travel incredibly long distances to search for a mate and new places to breed.',
            publishedAt: '2026-09-21T14:00:00Z'
          };
          const unrelated = {
            id: 'c',
            sourceName: 'Other',
            sourceUrl: 'https://example.com/c',
            title: 'New species of egg-eating snake discovered in Ethiopia',
            summary: 'Researchers described a snake that feeds on bird eggs.',
            publishedAt: '2026-09-21T14:00:00Z',
            eventCountry: 'ET'
          };

          if (!nearDuplicateStory(smithsonian, phys)) throw new Error('wild-dog paraphrase was not deduped');
          if (nearDuplicateStory(smithsonian, unrelated)) throw new Error('unrelated animal stories were collapsed');
          const synthetic = dedupeNearStories([smithsonian, phys, unrelated]);
          if (synthetic.length !== 2 || synthetic[0].id !== 'a' || synthetic[1].id !== 'c') {
            throw new Error('ordered semantic dedupe did not preserve first/best candidate');
          }

          const report = await collect();
          const focused = [
            'InsideEVs Italia Curiosita',
            'Motor1 France Insolite',
            'Motor1 Espana Curiosidades',
            'InsideEVs Brasil Curiosidades'
          ];
          const bySource = Object.fromEntries(report.bySource.map(x => [x.source, x.fetched]));
          const focusedFetched = Object.fromEntries(focused.map(name => [name, bySource[name] ?? 0]));
          const focusedErrors = report.errors.filter(error => focused.includes(error.source));

          console.log('FOCUSED_FEEDS=' + JSON.stringify({ focusedFetched, focusedErrors }));
          if (focusedErrors.length) throw new Error('focused feed errors: ' + JSON.stringify(focusedErrors));
          for (const [name, count] of Object.entries(focusedFetched)) {
            if (count < 1) throw new Error(name + ' returned no candidates');
          }

          const selected = selectScoutCandidates(report.candidates, 30);
          const languages = {};
          const sources = {};
          for (const candidate of selected) {
            languages[candidate.language ?? 'UNKNOWN'] = (languages[candidate.language ?? 'UNKNOWN'] ?? 0) + 1;
            sources[candidate.sourceName] = (sources[candidate.sourceName] ?? 0) + 1;
          }

          const duplicatePairs = [];
          for (let i = 0; i < selected.length; i += 1) {
            for (let j = i + 1; j < selected.length; j += 1) {
              if (nearDuplicateStory(selected[i], selected[j])) {
                duplicatePairs.push([selected[i].title, selected[j].title]);
              }
            }
          }
          if (duplicatePairs.length) throw new Error('selected batch still has near-story duplicates: ' + JSON.stringify(duplicatePairs));

          console.log('GLOBAL_V0610=' + JSON.stringify({
            sourceCount: report.sourceCount,
            fetched: report.fetched,
            kept: report.kept,
            errors: report.errors,
            dropped: report.dropped,
            selected: selected.length,
            languages,
            sources,
            focusedSelected: selected
              .filter(candidate => focused.includes(candidate.sourceName))
              .map(candidate => ({
                source: candidate.sourceName,
                language: candidate.language,
                sourceCountry: candidate.sourceCountry ?? candidate.country,
                score: preScoutPlayability(candidate).score,
                title: candidate.title
              }))
          }));
          NODE
