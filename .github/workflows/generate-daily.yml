name: Generate Daily Edition

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum candidates sent to the daily pipeline"
        required: true
        default: "30"
        type: choice
        options:
          - "15"
          - "30"
      confirm_cost:
        description: "I understand this run may incur OpenAI API cost"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: wtf-engine-manual-daily-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require explicit cost confirmation
        if: ${{ !inputs.confirm_cost }}
        run: |
          echo "Cost confirmation was not checked."
          exit 1

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=wtf-engine-daily")"
          TOKEN="$(jq -r '.value // empty' <<<"$RESPONSE")"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Generate production Daily Edition
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          LIMIT: ${{ inputs.limit }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$RUNNER_TEMP/wtf-daily-response.json"
          HTTP_CODE="$(curl --silent --show-error \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            "https://wtf-engine.vercel.app/api/daily?limit=${LIMIT}")"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Daily generation failed with HTTP ${HTTP_CODE}."
            jq -r '.error // "unknown_error"' "$RESPONSE_FILE" 2>/dev/null || true
            exit 1
          fi

          EDITION_DATE="$(jq -r '.persistence.editionDate // "none"' "$RESPONSE_FILE")"
          SCOUTED="$(jq -r '.scouted // 0' "$RESPONSE_FILE")"
          ELIGIBLE="$(jq -r '.editorEligible // 0' "$RESPONSE_FILE")"
          EDITED="$(jq -r '.edited // 0' "$RESPONSE_FILE")"
          NEW_CARDS="$(jq -r '(.persistence.newCardIds // []) | length' "$RESPONSE_FILE")"
          EDITION_CARDS="$(jq -r '(.persistence.editionCardIds // []) | length' "$RESPONSE_FILE")"
          PREVIOUSLY_PROCESSED="$(jq -r '.previouslyProcessed // 0' "$RESPONSE_FILE")"
          PREVIOUSLY_KNOWN="$(jq -r '.previouslyKnownStories // 0' "$RESPONSE_FILE")"
          COST_USD="$(jq -r '.ai.totalEstimatedCostUsd // 0' "$RESPONSE_FILE")"

          {
            echo "### WTF Engine Daily generation"
            echo ""
            echo "- Edition: ${EDITION_DATE}"
            echo "- Candidate limit: ${LIMIT}"
            echo "- Scouted: ${SCOUTED}"
            echo "- Editor eligible: ${ELIGIBLE}"
            echo "- Cards produced this run: ${EDITED}"
            echo "- New cards persisted: ${NEW_CARDS}"
            echo "- Total cards in draft edition: ${EDITION_CARDS}"
            echo "- Previously processed candidates skipped: ${PREVIOUSLY_PROCESSED}"
            echo "- Previously known stories skipped: ${PREVIOUSLY_KNOWN}"
            printf -- "- Estimated AI cost: $%.6f\n" "$COST_USD"
            echo ""
            echo "Card text, IDs and source payloads are intentionally not printed because this repository is public."
          } >> "$GITHUB_STEP_SUMMARY"
