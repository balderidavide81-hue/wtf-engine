name: Validate global multilingual sources

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/0.6.5-global-multilingual-sources

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - name: Probe newly enabled RSS and Atom feeds
        shell: bash
        run: |
          set -uo pipefail
          feeds=(
            "https://www.televideo.rai.it/televideo/pub/rss140.xml"
            "https://www.televideo.rai.it/televideo/pub/rss160.xml"
            "https://theconversation.com/fr/articles.atom"
            "https://theconversation.com/es/articles.atom"
            "https://theconversation.com/br/articles.atom"
            "https://theconversation.com/id/articles.atom"
            "https://theconversation.com/au/articles.atom"
            "https://theconversation.com/africa/articles.atom"
          )

          failures=0
          for feed in "${feeds[@]}"; do
            body="$(mktemp)"
            status="$(curl -L -A 'wtf-engine/0.6.5 (+editorial discovery)' -sS --max-time 20 -w '%{http_code}' -o "$body" "$feed" || true)"
            bytes="$(wc -c < "$body" | tr -d ' ')"
            echo "$status $bytes $feed"
            if [[ "$status" != "200" ]] || ! grep -Eiq '<(rss|feed|rdf:RDF)([[:space:]>])' "$body"; then
              echo "::error::Feed probe failed for $feed (HTTP $status, bytes $bytes)"
              failures=$((failures + 1))
            fi
            rm -f "$body"
          done

          if [[ "$failures" -ne 0 ]]; then
            echo "::error::$failures feed probe(s) failed"
            exit 1
          fi
