name: v0.6 one-shot validation

on:
  push:
    branches:
      - feature/0.6-rolling-sources-media

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wtf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wtf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Apply v0.5 baseline
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/001_content_store_v05.sql
      - name: Apply v0.6 migration
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/002_media_feed_v06.sql
      - name: Reapply v0.6 migration idempotently
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/002_media_feed_v06.sql
      - name: Validate v0.6 schema invariants
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            source_id uuid;
            article_id uuid;
          begin
            if not exists (select 1 from pg_extension where extname='pg_trgm') then
              raise exception 'pg_trgm missing';
            end if;

            if (
              select count(*)
                from information_schema.columns
               where table_schema='public'
                 and (
                   (table_name='articles' and column_name in (
                     'image_url_original','image_url_cached','image_alt_text',
                     'image_usage_status','discovery_source','category_hint'
                   ))
                   or
                   (table_name='game_cards' and column_name in (
                     'interaction_type','category','published_at'
                   ))
                 )
            ) <> 9 then
              raise exception 'v0.6 columns missing';
            end if;

            insert into sources(source_key,name)
            values('validation-source','Validation Source')
            returning id into source_id;

            insert into articles(
              external_id,source_id,source_name,source_url,canonical_url,title,image_usage_status
            )
            values(
              'validation-article',source_id,'Validation Source',
              'https://example.com/story','https://example.com/story',
              'A bizarre validation story','remote-display'
            )
            returning id into article_id;

            insert into game_cards(
              article_id,prompt_version,model,mode,interaction_type,category,
              hook,question,options,correct_option_index,reveal,resolution_rule
            )
            values(
              article_id,'editor/test','test-model','PREDICT','PREDICT','sports',
              'Future test','Will it happen?','["Yes","No"]'::jsonb,null,
              'Pending evidence','Resolve from the official result.'
            );

            begin
              insert into game_cards(
                article_id,prompt_version,model,mode,interaction_type,category,
                hook,question,options,correct_option_index,reveal,resolution_rule
              )
              values(
                article_id,'editor/invalid-interaction','test-model','PREDICT','MULTIPLE_CHOICE','sports',
                'Invalid test','Will it happen?','["Yes","No"]'::jsonb,null,
                'Pending evidence','Resolve from the official result.'
              );
              raise exception 'invalid PREDICT interaction unexpectedly accepted';
            exception
              when check_violation then null;
            end;

            begin
              update articles set image_usage_status='not-a-real-status' where id=article_id;
              raise exception 'invalid media status unexpectedly accepted';
            exception
              when check_violation then null;
            end;
          end $$;
          SQL
