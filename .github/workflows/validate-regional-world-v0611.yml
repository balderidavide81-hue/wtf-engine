name: Validate v0.6.11 regional world sources

# Re-run after Clarín timeout/retry tuning

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: ./node_modules/.bin/tsc --noEmit false --outDir .tmp-build

      - name: Validate live regional feeds and pre-Scout mix
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const { collect } = await import('./.tmp-build/src/ingest/collect.js');
          const { selectScoutCandidates } = await import('./.tmp-build/src/pipeline/daily.js');
          const { preScoutPlayability } = await import('./.tmp-build/src/pipeline/playability.js');

          const expected = [
            'Clarin Autos',
            'TimesLIVE Lifestyle',
            'TimesLIVE Motoring',
            'The Standard Magazines',
            'The Standard Entertainment',
            'Global Voices Japan'
          ];

          const report = await collect();
          const bySource = Object.fromEntries(report.bySource.map(row => [row.source, row.fetched]));
          const expectedFetched = Object.fromEntries(expected.map(name => [name, bySource[name] ?? 0]));
          const expectedErrors = report.errors.filter(error => expected.includes(error.source));

          console.log('REGIONAL_FEEDS=' + JSON.stringify({ expectedFetched, expectedErrors }));
          if (expectedErrors.length) throw new Error('regional feed errors: ' + JSON.stringify(expectedErrors));
          for (const [name, count] of Object.entries(expectedFetched)) {
            if (count < 1) throw new Error(name + ' returned no candidates');
          }

          const selected = selectScoutCandidates(report.candidates, 30);
          const sourceCountries = {};
          const eventCountries = {};
          const languages = {};
          for (const candidate of selected) {
            const sourceCountry = candidate.sourceCountry ?? candidate.country ?? 'UNKNOWN';
            const eventCountry = candidate.eventCountry ?? 'UNKNOWN';
            sourceCountries[sourceCountry] = (sourceCountries[sourceCountry] ?? 0) + 1;
            eventCountries[eventCountry] = (eventCountries[eventCountry] ?? 0) + 1;
            languages[candidate.language ?? 'UNKNOWN'] = (languages[candidate.language ?? 'UNKNOWN'] ?? 0) + 1;
          }

          const regionalSelected = selected
            .filter(candidate => expected.includes(candidate.sourceName))
            .map(candidate => ({
              source: candidate.sourceName,
              sourceCountry: candidate.sourceCountry ?? candidate.country,
              eventCountry: candidate.eventCountry,
              language: candidate.language,
              score: preScoutPlayability(candidate).score,
              title: candidate.title
            }));

          const regionalTop = Object.fromEntries(expected.map(source => [
            source,
            report.candidates
              .filter(candidate => candidate.sourceName === source)
              .map(candidate => ({ candidate, score: preScoutPlayability(candidate).score }))
              .sort((a, b) => b.score - a.score)
              .slice(0, 3)
              .map(({ candidate, score }) => ({
                score,
                title: candidate.title,
                eventCountry: candidate.eventCountry,
                language: candidate.language
              }))
          ]));

          console.log('REGIONAL_TOP=' + JSON.stringify(regionalTop));
          console.log('V0611_MIX=' + JSON.stringify({
            sourceCount: report.sourceCount,
            fetched: report.fetched,
            kept: report.kept,
            errors: report.errors,
            dropped: report.dropped,
            selected: selected.length,
            languages,
            sourceCountries,
            eventCountries,
            regionalSelected
          }));
          NODE
